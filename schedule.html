<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Расписание уроков — ZagranEasy</title>
<style>
  :root{
    --navy:#1F4E78;
    --navy-dark:#123047;
    --bg:#F7F8FA;
    --card:#FFFFFF;
    --border:#E1E5EA;
    --text:#1C242C;
    --text-muted:#6B7480;
    --green:#2E7D4F;
    --green-bg:#E7F5EC;
    --amber:#B7791F;
    --amber-bg:#FCF3E1;
    --red:#B3261E;
    --red-bg:#FBEAE9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:24px; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }
  .wrap{max-width:960px;margin:0 auto;}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
  h1{font-size:20px;font-weight:600;margin:0;color:var(--navy-dark);}
  .sub{font-size:13px;color:var(--text-muted);margin-top:4px;}
  .mode-toggle{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--card);}
  .mode-toggle button{
    border:none;background:transparent;padding:8px 16px;font-size:13px;cursor:pointer;color:var(--text-muted);
  }
  .mode-toggle button.active{background:var(--navy);color:#fff;font-weight:600;}
  .course{
    background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px;
  }
  .course-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
  .course-title{font-size:17px;font-weight:600;color:var(--navy-dark);}
  .course-days{font-size:13px;color:var(--text-muted);margin-top:2px;}
  .admin-edit{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px;padding:12px;background:var(--bg);border-radius:8px;}
  .admin-edit input{
    border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:13px;width:110px;
  }
  .admin-edit label{font-size:11px;color:var(--text-muted);display:block;margin-bottom:2px;}
  .slot{border-top:1px solid var(--border);padding-top:14px;margin-top:14px;}
  .slot:first-of-type{border-top:none;margin-top:8px;padding-top:0;}
  .slot-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap;}
  .slot-time{font-size:14px;font-weight:600;color:var(--navy-dark);}
  .slot-time-edit{border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:13px;width:150px;}
  .remove-slot{border:none;background:transparent;color:var(--text-muted);font-size:12px;cursor:pointer;text-decoration:underline;}
  .remove-slot:hover{color:var(--red);}
  .add-slot{
    border:1px dashed var(--border);background:transparent;color:var(--navy);border-radius:8px;
    padding:8px 12px;font-size:13px;cursor:pointer;width:100%;margin-top:10px;font-weight:600;
  }
  .formats{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:640px){.formats{grid-template-columns:1fr;}}
  .format-card{border:1px solid var(--border);border-radius:10px;padding:12px;}
  .format-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .format-name{font-size:13px;font-weight:600;}
  .count-badge{font-size:12px;padding:3px 9px;border-radius:999px;font-weight:600;}
  .count-ok{background:var(--green-bg);color:var(--green);}
  .count-warn{background:var(--amber-bg);color:var(--amber);}
  .count-full{background:var(--red-bg);color:var(--red);}
  .bar{height:6px;background:var(--border);border-radius:4px;overflow:hidden;margin-bottom:10px;}
  .bar-fill{height:100%;background:var(--navy);}
  .student-list{list-style:none;margin:0 0 10px;padding:0;}
  .student-list li{
    display:flex;justify-content:space-between;align-items:center;
    padding:5px 0;border-bottom:1px solid var(--border);font-size:13px;
  }
  .student-list li:last-child{border-bottom:none;}
  .student-name{font-weight:500;}
  .student-phone{color:var(--text-muted);font-size:12px;margin-left:6px;}
  .remove-btn{
    border:none;background:transparent;color:var(--text-muted);cursor:pointer;font-size:16px;line-height:1;padding:2px 6px;
  }
  .remove-btn:hover{color:var(--red);}
  .empty-hint{font-size:12px;color:var(--text-muted);padding:5px 0;}
  .add-form{display:flex;gap:6px;flex-wrap:wrap;}
  .add-form input{
    flex:1;min-width:90px;border:1px solid var(--border);border-radius:6px;padding:7px 8px;font-size:13px;
  }
  .add-form button{
    border:none;background:var(--navy);color:#fff;border-radius:6px;padding:7px 12px;font-size:13px;
    cursor:pointer;font-weight:600;
  }
  .add-form button:disabled{background:var(--border);color:var(--text-muted);cursor:not-allowed;}
  .error{color:var(--red);font-size:12px;margin-top:4px;width:100%;}
  .status{font-size:12px;color:var(--text-muted);margin-top:16px;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Расписание уроков</h1>
      <div class="sub">Запись студентов — общее для всех менеджеров</div>
    </div>
    <div class="mode-toggle">
      <button id="btn-manager" class="active">Менеджер</button>
      <button id="btn-admin">Админ</button>
    </div>
  </header>
  <div id="courses"></div>
  <div class="status" id="status">Загрузка расписания…</div>
</div>

<script>
const COURSE_KEYS = ["english", "chinese"];
const DEFAULT_COURSES = {
  english: {
    name: "Английский", days: "Пн — Ср", offline_cap: 8, online_cap: 10,
    slots: ["15:00 — 17:00"]
  },
  chinese: {
    name: "Китайский", days: "Чт — Сб", offline_cap: 6, online_cap: 10,
    slots: ["10:00 — 11:30", "11:45 — 13:15", "13:45 — 15:15", "15:30 — 17:00", "17:15 — 18:45"]
  }
};

let mode = "manager";
let courses = null;
let enrollments = null;

function slotKey(courseKey, slotIdx, fmt){ return courseKey + "_" + slotIdx + "_" + fmt; }

async function loadData(){
  try{
    const c = await window.storage.get("schedule-courses-v2", true);
    courses = c ? JSON.parse(c.value) : JSON.parse(JSON.stringify(DEFAULT_COURSES));
  }catch(e){ courses = JSON.parse(JSON.stringify(DEFAULT_COURSES)); }
  try{
    const e = await window.storage.get("schedule-enrollments-v2", true);
    enrollments = e ? JSON.parse(e.value) : {};
  }catch(e){ enrollments = {}; }
  render();
  document.getElementById("status").textContent = "Данные сохраняются автоматически и видны всем менеджерам.";
}

async function saveCourses(){
  try{ await window.storage.set("schedule-courses-v2", JSON.stringify(courses), true); }
  catch(e){ document.getElementById("status").textContent = "Не удалось сохранить изменения. Попробуйте ещё раз."; }
}
async function saveEnrollments(){
  try{ await window.storage.set("schedule-enrollments-v2", JSON.stringify(enrollments), true); }
  catch(e){ document.getElementById("status").textContent = "Не удалось сохранить запись. Попробуйте ещё раз."; }
}

function countClass(filled, cap){
  if(filled >= cap) return "count-full";
  if(filled / cap >= 0.7) return "count-warn";
  return "count-ok";
}

function render(){
  const root = document.getElementById("courses");
  root.innerHTML = "";
  COURSE_KEYS.forEach(key=>{
    const c = courses[key];
    const div = document.createElement("div");
    div.className = "course";

    const head = document.createElement("div");
    head.className = "course-head";
    head.innerHTML = `<div><div class="course-title">${c.name}</div><div class="course-days">${c.days}</div></div>`;
    div.appendChild(head);

    if(mode === "admin"){
      const edit = document.createElement("div");
      edit.className = "admin-edit";
      edit.innerHTML = `
        <div><label>Дни</label><input data-field="days" value="${c.days}"></div>
        <div><label>Офлайн мест / слот</label><input data-field="offline_cap" type="number" min="0" value="${c.offline_cap}"></div>
        <div><label>Онлайн мест / слот</label><input data-field="online_cap" type="number" min="0" value="${c.online_cap}"></div>
      `;
      edit.querySelectorAll("input").forEach(inp=>{
        inp.addEventListener("change", async ()=>{
          const field = inp.dataset.field;
          const val = inp.type === "number" ? Math.max(0, parseInt(inp.value) || 0) : inp.value;
          courses[key][field] = val;
          await saveCourses();
          render();
        });
      });
      div.appendChild(edit);
    }

    c.slots.forEach((slotTime, idx)=>{
      const slotDiv = document.createElement("div");
      slotDiv.className = "slot";

      const slotHead = document.createElement("div");
      slotHead.className = "slot-head";
      if(mode === "admin"){
        slotHead.innerHTML = `<input class="slot-time-edit" value="${slotTime}"><button class="remove-slot">Удалить слот</button>`;
        const timeInp = slotHead.querySelector("input");
        timeInp.addEventListener("change", async ()=>{
          courses[key].slots[idx] = timeInp.value;
          await saveCourses();
          render();
        });
        slotHead.querySelector(".remove-slot").addEventListener("click", async ()=>{
          if(c.slots.length <= 1){ return; }
          courses[key].slots.splice(idx,1);
          delete enrollments[slotKey(key, idx, "offline")];
          delete enrollments[slotKey(key, idx, "online")];
          await saveCourses();
          await saveEnrollments();
          render();
        });
      } else {
        slotHead.innerHTML = `<span class="slot-time">${slotTime}</span>`;
      }
      slotDiv.appendChild(slotHead);

      const formats = document.createElement("div");
      formats.className = "formats";
      ["offline","online"].forEach(fmt=>{
        const cap = fmt === "offline" ? c.offline_cap : c.online_cap;
        const listKey = slotKey(key, idx, fmt);
        const list = enrollments[listKey] || [];
        const card = document.createElement("div");
        card.className = "format-card";

        const fHead = document.createElement("div");
        fHead.className = "format-head";
        const label = fmt === "offline" ? "Офлайн" : "Онлайн";
        fHead.innerHTML = `<span class="format-name">${label}</span><span class="count-badge ${countClass(list.length,cap)}">${list.length} / ${cap}</span>`;
        card.appendChild(fHead);

        const bar = document.createElement("div");
        bar.className = "bar";
        const fill = document.createElement("div");
        fill.className = "bar-fill";
        fill.style.width = Math.min(100, (list.length/cap)*100) + "%";
        bar.appendChild(fill);
        card.appendChild(bar);

        if(list.length === 0){
          const hint = document.createElement("div");
          hint.className = "empty-hint";
          hint.textContent = "Пока никто не записан.";
          card.appendChild(hint);
        } else {
          const ul = document.createElement("ul");
          ul.className = "student-list";
          list.forEach(s=>{
            const li = document.createElement("li");
            li.innerHTML = `<span><span class="student-name">${s.name}</span><span class="student-phone">${s.phone || ""}</span></span>`;
            const rm = document.createElement("button");
            rm.className = "remove-btn";
            rm.setAttribute("aria-label","Удалить");
            rm.textContent = "×";
            rm.addEventListener("click", async ()=>{
              enrollments[listKey] = enrollments[listKey].filter(x=>x.id !== s.id);
              await saveEnrollments();
              render();
            });
            li.appendChild(rm);
            ul.appendChild(li);
          });
          card.appendChild(ul);
        }

        const form = document.createElement("div");
        form.className = "add-form";
        const isFull = list.length >= cap;
        form.innerHTML = `
          <input type="text" placeholder="Имя студента" data-role="name">
          <input type="text" placeholder="Телефон" data-role="phone">
          <button type="button" ${isFull ? "disabled" : ""}>${isFull ? "Мест нет" : "Записать"}</button>
        `;
        const errDiv = document.createElement("div");
        errDiv.className = "error";
        form.appendChild(errDiv);
        const btn = form.querySelector("button");
        const nameInp = form.querySelector('[data-role="name"]');
        const phoneInp = form.querySelector('[data-role="phone"]');
        btn.addEventListener("click", async ()=>{
          errDiv.textContent = "";
          if(!nameInp.value.trim()){
            errDiv.textContent = "Введите имя студента";
            return;
          }
          if((enrollments[listKey]||[]).length >= cap){
            errDiv.textContent = "Свободных мест больше нет";
            render();
            return;
          }
          enrollments[listKey] = enrollments[listKey] || [];
          enrollments[listKey].push({
            id: Date.now() + "_" + Math.random().toString(36).slice(2,7),
            name: nameInp.value.trim(),
            phone: phoneInp.value.trim()
          });
          await saveEnrollments();
          render();
        });
        card.appendChild(form);
        formats.appendChild(card);
      });
      slotDiv.appendChild(formats);
      div.appendChild(slotDiv);
    });

    if(mode === "admin"){
      const addBtn = document.createElement("button");
      addBtn.className = "add-slot";
      addBtn.textContent = "+ Добавить временной слот";
      addBtn.addEventListener("click", async ()=>{
        courses[key].slots.push("00:00 — 00:00");
        await saveCourses();
        render();
      });
      div.appendChild(addBtn);
    }

    root.appendChild(div);
  });
}

document.getElementById("btn-manager").addEventListener("click", ()=>{
  mode = "manager";
  document.getElementById("btn-manager").classList.add("active");
  document.getElementById("btn-admin").classList.remove("active");
  render();
});
document.getElementById("btn-admin").addEventListener("click", ()=>{
  mode = "admin";
  document.getElementById("btn-admin").classList.add("active");
  document.getElementById("btn-manager").classList.remove("active");
  render();
});

loadData();
</script>
</body>
</html>
